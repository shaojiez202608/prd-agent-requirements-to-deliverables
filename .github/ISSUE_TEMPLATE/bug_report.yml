name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include account IDs, credentials, real customer data or unmasked command output.
        Security issues: see SECURITY.md, not this form.
  - type: input
    id: commit
    attributes:
      label: Commit or version
      description: Output of `git rev-parse --short HEAD` or the release tag.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands you ran, with synthetic input.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [intake forms / prompt compiler, generator, validate / check-progress, publish / fetch, infra (CDK), docs]
    validations:
      required: true
