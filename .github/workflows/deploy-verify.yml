name: deploy-verify

# Manual only. Deploys the sandbox stack, runs the end-to-end checks, destroys it and checks for residue.
# Requires a GitHub environment named "sandbox-aws" with required reviewers, and an IAM role for GitHub OIDC
# in a non-production account. Replace the placeholder role ARN below.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-verify
  cancel-in-progress: false

jobs:
  deploy-verify-destroy:
    name: deploy, verify, destroy, residue check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: sandbox-aws
    permissions:
      contents: read
      id-token: write # OIDC token for configure-aws-credentials
    env:
      AWS_REGION: us-east-1
      PREFLIGHT_CONFIRM: "yes"
      CLEANUP_CONFIRM_STACK: proto-prd-artifacts
      CLEANUP_CONFIRM_DATA: DELETE DATA
      CLEANUP_CONFIRM_ASSETS: DELETE ASSETS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::111122223333:role/<DEPLOY_ROLE_NAME>
          aws-region: us-east-1
      - name: Deploy (preflight, synth with cdk-nag, destructive-diff guard)
        run: make deploy
      - name: End-to-end verification
        run: make verify
      - name: Destroy
        if: always()
        run: make destroy
      - name: Residue check
        if: always()
        run: make verify-cleanup
