[project]
name = "prd-agent-requirements-to-deliverables"
version = "0.1.0"
description = "Structured intake -> deterministic prompt -> six cross-consistent IoT product deliverables (prototype)"
readme = "README.md"
license = "MIT-0"
requires-python = ">=3.12"
dependencies = [
  "fpdf2>=2.8",
]

[project.scripts]
prd-agent = "prd_agent.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]
publish = [
  "boto3>=1.35",
]
infra = [
  "aws-cdk-lib>=2.170.0",
  "constructs>=10.4",
  "cdk-nag>=2.30,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prd_agent"]

# exclude-newer: dependency cooldown, do not resolve package versions published in the last 7 days.
[tool.uv]
exclude-newer = "7 days"
default-groups = ["dev", "publish", "infra"]

[tool.pytest.ini_options]
pythonpath = ["src", "infra"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["infra/cdk.out", "out"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.ruff.lint.isort]
known-first-party = ["prd_agent", "prd_infra", "conftest"]
